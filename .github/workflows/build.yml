name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --save-dev --legacy-peer-deps @capacitor/cli@^6.0.0 @capacitor/core@^6.0.0 @capacitor/android@^6.0.0

      - name: Build Web Assets & Generate Android Shell
        run: |
          npm run build
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Compile Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK for Users
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/PulseNet-v12.0.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v12.0
          name: "PulseNet v12.0 Official Release"
          body: |
            ### 📱 PulseNet v12.0 (Zero-Knowledge Social App)
            
            Welcome to the official Android release of PulseNet!
            
            #### 🌟 Features:
            - **End-to-End Encrypted Whispers (AES-256 / SHA-256)**
            - **Self-Destructing Ghost Mode Messages**
            - **4-Digit Vault PIN Security**
            - **Sparks Reels & Vertical Video Player**
            - **24/7 Real-Time Cloud Database Sync**
            
            #### 📥 Download Instructions:
            Download **`PulseNet-v12.0.apk`** below and install it directly on your Android phone.
          files: release-assets/PulseNet-v12.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
