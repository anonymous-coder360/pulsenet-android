name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install NPM Packages
        run: |
          npm install --legacy-peer-deps
          npm install --save-dev @capacitor/cli @capacitor/core @capacitor/android

      - name: Build Web Production Assets
        run: npm run build

      - name: Add Android Platform & Sync
        run: |
          npx @capacitor/cli add android
          npx @capacitor/cli sync android

      - name: Compile Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: PulseNet-Release-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
